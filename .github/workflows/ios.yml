name: iOS

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          elif [ -d /Applications/Xcode_26.5.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.5.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version
          swift --version

      - name: Choose an iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          UDID=$(python3 - <<'PY'
          import json, re, subprocess, sys
          raw = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"])
          data = json.loads(raw)
          candidates = []
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  name = device.get("name", "")
                  if device.get("isAvailable") and name.startswith("iPhone"):
                      candidates.append((runtime, name, device["udid"]))
          if not candidates:
              sys.exit("No available iPhone simulator")
          def version_tuple(text):
              return tuple(int(part) for part in re.findall(r"\d+", text))

          def model_number(name):
              match = re.search(r"iPhone\s+(\d+)", name)
              return int(match.group(1)) if match else -1

          phones = []
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  name = device.get("name", "")
                  if device.get("isAvailable") and name.startswith("iPhone"):
                      phones.append({
                          "runtime": runtime,
                          "version": version_tuple(runtime),
                          "name": name,
                          "udid": device["udid"],
                      })

          def choose_plain():
              plain = [item for item in phones if all(word not in item["name"] for word in ("Pro", "Max", "Plus", "SE", "mini", "Air"))]
              pool = plain or phones
              if not pool:
                  sys.exit("No available iPhone simulator")
              pool.sort(key=lambda item: (item["version"], model_number(item["name"]), item["name"]))
              return pool[-1]

          def choose_se():
              matches = [item for item in phones if "SE" in item["name"] and "3rd" in item["name"]]
              matches.sort(key=lambda item: (item["version"], item["name"]))
              return matches[-1] if matches else None

          def choose_pro_max():
              matches = [item for item in phones if "Pro Max" in item["name"]]
              matches.sort(key=lambda item: (item["version"], model_number(item["name"]), item["name"]))
              return matches[-1] if matches else None

          def create(type_match, label):
              types = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devicetypes", "-j"]))["devicetypes"]
              runtimes = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "runtimes", "available", "-j"]))["runtimes"]
              ios = [runtime for runtime in runtimes if "iOS" in runtime.get("name", "") and runtime.get("isAvailable", True)]
              if not ios:
                  sys.exit("No available iOS runtime")
              ios.sort(key=lambda runtime: version_tuple(runtime.get("version") or runtime["name"]))
              runtime = ios[-1]
              matches = [item for item in types if type_match(item["name"]) and item["name"].startswith("iPhone")]
              if not matches:
                  names = ", ".join(sorted(item["name"] for item in types if "iPhone" in item["name"]))
                  sys.exit(f"Missing iPhone device type. Installed: {names}")
              matches.sort(key=lambda item: (model_number(item["name"]), item["name"]))
              chosen = matches[-1]
              udid = subprocess.check_output(
                  ["xcrun", "simctl", "create", label, chosen["identifier"], runtime["identifier"]],
                  text=True,
              ).strip()
              print(f"Created {chosen['name']} ({udid}) on {runtime['name']}", file=sys.stderr)
              return udid, chosen["name"]

          primary = choose_plain()
          small = choose_se()
          large = choose_pro_max()
          if small is None:
              se_udid, se_name = create(lambda name: "SE" in name and "3rd" in name, "PaperGlide SE")
          else:
              se_udid, se_name = small["udid"], small["name"]
          if large is None:
              max_udid, max_name = create(lambda name: "Pro Max" in name, "PaperGlide Pro Max")
          else:
              max_udid, max_name = large["udid"], large["name"]
          print(f"Primary {primary['name']} on {primary['runtime']}", file=sys.stderr)
          print(f"Small {se_name}", file=sys.stderr)
          print(f"Large {max_name}", file=sys.stderr)
          print(f"{primary['udid']}|{se_udid}|{max_udid}")
          PY
          )
          PRIMARY_UDID="${UDID%%|*}"
          REST="${UDID#*|}"
          SE_UDID="${REST%%|*}"
          MAX_UDID="${REST##*|}"
          echo "udid=$PRIMARY_UDID" >> "$GITHUB_OUTPUT"
          echo "se_udid=$SE_UDID" >> "$GITHUB_OUTPUT"
          echo "max_udid=$MAX_UDID" >> "$GITHUB_OUTPUT"

      - name: Build Paper Glide for the iOS Simulator
        run: |
          set -euo pipefail
          xcodebuild build \
            -project App/PaperGlide.xcodeproj \
            -scheme PaperGlide \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug \
            -derivedDataPath DerivedData \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            'CODE_SIGN_IDENTITY=-'

      - name: Run unit tests and screenshot UI test
        id: tests
        run: |
          set -euo pipefail
          rm -rf DerivedData/PaperGlide.xcresult
          xcodebuild test \
            -project App/PaperGlide.xcodeproj \
            -scheme PaperGlide \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug \
            -derivedDataPath DerivedData \
            -resultBundlePath DerivedData/PaperGlide.xcresult \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            'CODE_SIGN_IDENTITY=-'

      - name: Run death-screen layout test on iPhone SE
        id: se
        if: always()
        run: |
          set -euo pipefail
          udid="${{ steps.sim.outputs.se_udid }}"
          xcrun simctl shutdown all || true
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          rm -rf DerivedData/DeathSE.xcresult
          xcodebuild test \
            -project App/PaperGlide.xcodeproj \
            -scheme PaperGlide \
            -destination "platform=iOS Simulator,id=${udid}" \
            -only-testing:PaperGlideUITests/PaperGlideDeathLayoutUITests \
            -configuration Debug \
            -derivedDataPath DerivedData \
            -resultBundlePath DerivedData/DeathSE.xcresult \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            'CODE_SIGN_IDENTITY=-'

      - name: Run death-screen layout test on iPhone Pro Max
        id: large
        if: always()
        run: |
          set -euo pipefail
          udid="${{ steps.sim.outputs.max_udid }}"
          run_large() {
            xcrun simctl shutdown all || true
            xcrun simctl boot "$udid" || true
            xcrun simctl bootstatus "$udid" -b
            rm -rf DerivedData/DeathMax.xcresult
            xcodebuild test \
              -project App/PaperGlide.xcodeproj \
              -scheme PaperGlide \
              -destination "platform=iOS Simulator,id=${udid}" \
              -only-testing:PaperGlideUITests/PaperGlideDeathLayoutUITests \
              -configuration Debug \
              -derivedDataPath DerivedData \
              -resultBundlePath DerivedData/DeathMax.xcresult \
              -skipPackagePluginValidation \
              -skipMacroValidation \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              'CODE_SIGN_IDENTITY=-'
          }
          if ! run_large; then
            echo "Pro Max layout test failed. Booting the simulator and trying once more."
            run_large
          fi

      - name: Extract screenshots from the xcresult
        id: shots
        if: always()
        run: |
          set -euo pipefail
          chmod +x scripts/extract-xcresult-screenshots.sh
          scripts/extract-xcresult-screenshots.sh DerivedData/PaperGlide.xcresult /tmp/paper-glide-screenshots
          mkdir -p /tmp/merged-shots
          find /tmp/paper-glide-screenshots/png -name '*.png' -type f -exec cp {} /tmp/merged-shots/ \;
          if [[ -d DerivedData/DeathSE.xcresult ]]; then
            scripts/extract-xcresult-screenshots.sh DerivedData/DeathSE.xcresult /tmp/paper-glide-se
            find /tmp/paper-glide-se/png -name '*.png' -type f -exec cp {} /tmp/merged-shots/ \;
          fi
          if [[ -d DerivedData/DeathMax.xcresult ]]; then
            scripts/extract-xcresult-screenshots.sh DerivedData/DeathMax.xcresult /tmp/paper-glide-max
            find /tmp/paper-glide-max/png -name '*.png' -type f -exec cp {} /tmp/merged-shots/ \;
          fi
          rm -rf /tmp/paper-glide-screenshots/png
          mkdir -p /tmp/paper-glide-screenshots/png
          find /tmp/merged-shots -name '*.png' -type f -exec cp {} /tmp/paper-glide-screenshots/png/ \;
          manifest=/tmp/paper-glide-screenshots/png/MANIFEST.txt
          : > "$manifest"
          while IFS= read -r file; do
            size=$(wc -c < "$file" | tr -d ' ')
            printf '%8d  %s\n' "$size" "$(basename "$file")" >> "$manifest"
          done < <(find /tmp/paper-glide-screenshots/png -name '*.png' -type f | sort)
          echo "---- screenshot files with sizes ----"
          find /tmp/paper-glide-screenshots/png -type f -exec ls -l {} \;
          count=$(find /tmp/paper-glide-screenshots/png -name '*.png' -type f | wc -l | tr -d ' ')
          echo "PNG_COUNT=$count"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [[ "${{ steps.tests.outcome }}" == "success" && "$count" -eq 0 ]]; then
            echo "Tests passed but no PNG attachments were extracted."
            exit 1
          fi
          death_count=$(find /tmp/paper-glide-screenshots/png -name 'death-worst-*.png' -type f | wc -l | tr -d ' ')
          echo "DEATH_PNG_COUNT=$death_count"
          if [[ "${{ steps.se.outcome }}" == "success" ]]; then
            find /tmp/paper-glide-screenshots/png -iname 'death-worst-*se*.png' -type f | grep -q . \
              || { echo "iPhone SE layout test passed but no SE death screenshot was extracted."; exit 1; }
          fi
          if [[ "${{ steps.large.outcome }}" == "success" ]]; then
            find /tmp/paper-glide-screenshots/png -iname 'death-worst-*pro-max*.png' -type f | grep -q . \
              || { echo "Pro Max layout test passed but no Pro Max death screenshot was extracted."; exit 1; }
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-glide-screenshots
          path: /tmp/paper-glide-screenshots/png
          if-no-files-found: warn

      - name: Upload xcresult
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-glide-xcresult
          path: DerivedData/PaperGlide.xcresult
          if-no-files-found: warn

      - name: Commit screenshots onto the branch
        if: always() && github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          count=$(find /tmp/paper-glide-screenshots/png -name '*.png' -type f 2>/dev/null | wc -l | tr -d ' ')
          if [[ "$count" -eq 0 ]]; then
            echo "No PNGs to commit."
            exit 0
          fi
          sha=$(git rev-parse HEAD)
          mkdir -p "evidence/$sha"
          find /tmp/paper-glide-screenshots/png -name '*.png' -type f -exec cp {} "evidence/$sha/" \;
          if [[ -f /tmp/paper-glide-screenshots/png/MANIFEST.txt ]]; then
            cp /tmp/paper-glide-screenshots/png/MANIFEST.txt "evidence/$sha/MANIFEST.txt"
          fi
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add "evidence/$sha"
          if git diff --cached --quiet; then
            echo "Screenshots already committed."
            exit 0
          fi
          git commit -m "Add simulator screenshots for ${sha} [skip ci]"
          git push origin "HEAD:${{ github.head_ref }}"
