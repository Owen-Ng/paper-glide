name: iOS

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          elif [ -d /Applications/Xcode_26.5.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.5.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version
          swift --version

      - name: Choose an iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          UDID=$(python3 - <<'PY'
          import json, subprocess, sys
          raw = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"])
          data = json.loads(raw)
          candidates = []
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  name = device.get("name", "")
                  if device.get("isAvailable") and name.startswith("iPhone"):
                      candidates.append((runtime, name, device["udid"]))
          if not candidates:
              sys.exit("No available iPhone simulator")
          candidates.sort()
          plain = [item for item in candidates if all(word not in item[1] for word in ("Pro", "Max", "Plus", "SE", "mini", "Air"))]
          choice = plain[-1] if plain else candidates[-1]
          print(f"Using {choice[1]} on {choice[0]}", file=sys.stderr)
          print(choice[2])
          PY
          )
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build Paper Glide for the iOS Simulator
        run: |
          set -euo pipefail
          xcodebuild build \
            -project App/PaperGlide.xcodeproj \
            -scheme PaperGlide \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug \
            -derivedDataPath DerivedData \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            'CODE_SIGN_IDENTITY=-'

      - name: Run unit tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -project App/PaperGlide.xcodeproj \
            -scheme PaperGlide \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug \
            -derivedDataPath DerivedData \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            'CODE_SIGN_IDENTITY=-'
